<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VORTEX FLIX — Catálogo de Filmes</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&family=Syne:wght@700;800&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
    <style>
        /* Estilos específicos e customizados do Vortex Flix (Visual Netflix Focado) */
        body {
            background-color: #0b0b0f !important;
            background-image: radial-gradient(circle at 50% -20%, rgba(229, 9, 20, 0.15) 0%, transparent 80%) !important;
            overflow-y: auto !important;
            height: auto !important;
            padding-bottom: 40px;
        }
        .flix-header {
            padding: 40px 0 20px;
            text-align: center;
        }
        .flix-logo {
            font-family: 'Syne', sans-serif;
            font-size: 2.5rem;
            font-weight: 800;
            letter-spacing: 4px;
            color: #E50914;
            text-shadow: 0 0 20px rgba(229, 9, 20, 0.6);
            margin-bottom: 8px;
            text-transform: uppercase;
        }
        .flix-logo span {
            color: #ffffff;
            text-shadow: none;
        }
        .flix-subtitle {
            font-size: 0.9rem;
            color: rgba(255, 255, 255, 0.6);
            margin-bottom: 30px;
        }
        .movies-grid-full {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(130px, 1fr));
            gap: 16px;
            padding: 0 10px;
        }
        @media(min-width: 600px) {
            .movies-grid-full {
                grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
                gap: 20px;
            }
        }
    </style>
</head>
<body>

    <div class="container">
        <header class="flix-header">
            <h1 class="flix-logo">VORTEX <span>FLIX</span></h1>
            <p class="flix-subtitle">Seu cinema pessoal sem anúncios e sem limites.</p>
        </header>

        <main>
            <div class="movies-grid-full" id="moviesGrid">
                <!-- Filmes injetados dinamicamente via JS -->
            </div>
        </main>
    </div>

    <script>
        let catalogMovies = [];

        async function carregarCatalogoNetMovies() {
            try {
                const res = await fetch('/movies_list.json');
                if (!res.ok) throw new Error("Erro ao ler JSON");
                catalogMovies = await res.json();
                renderCatalogoNetMovies();
            } catch (e) {
                console.error("Erro ao carregar o catálogo de filmes:", e);
                document.getElementById('moviesGrid').innerHTML = '<p class="gallery-empty">Erro ao carregar filmes. Verifique a conexão.</p>';
            }
        }

        function renderCatalogoNetMovies() {
            const grid = document.getElementById('moviesGrid');
            grid.innerHTML = '';
            
            catalogMovies.forEach(movie => {
                const card = document.createElement('div');
                card.className = 'movie-card';
                card.onclick = () => abrirPlayerFilme(movie.id, movie.title);
                card.innerHTML = `
                    <div class="movie-poster-wrapper">
                        <img src="${movie.poster}" alt="${movie.title}" class="movie-poster" onerror="this.src='https://images.unsplash.com/photo-1536440136628-849c177e76a1?q=80&w=300&auto=format&fit=crop'">
                        <div class="movie-play-overlay">▶</div>
                    </div>
                    <div class="movie-info-wrap">
                        <h4 class="movie-card-title">${esc(movie.title)}</h4>
                    </div>
                `;
                grid.appendChild(card);
            });
        }

        function abrirPlayerFilme(videoId, title) {
            const m = document.createElement('div');
            m.className = 'modal';
            m.onclick = (e) => { if (e.target === m) m.remove(); };
            
            // Usamos a URL de embed sem anúncios e limpa do YouTube para rodar direto no app!
            const iframeTag = `<iframe src="https://www.youtube.com/embed/${videoId}?autoplay=1&modestbranding=1&rel=0" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen style="width:100%; height:100%; aspect-ratio:16/9; border-radius:12px; box-shadow: 0 10px 30px rgba(0,0,0,0.5)"></iframe>`;
            
            m.innerHTML = `<div class="modal-inner" style="max-width:850px;" onclick="event.stopPropagation()"><button class="modal-x" onclick="this.closest('.modal').remove()">✕</button>${iframeTag}</div>`;
            document.body.appendChild(m);
        }

        function esc(s) { const d = document.createElement('div'); d.textContent = s; return d.innerHTML; }

        // Inicializar
        carregarCatalogoNetMovies();
    </script>
</body>
</html>
